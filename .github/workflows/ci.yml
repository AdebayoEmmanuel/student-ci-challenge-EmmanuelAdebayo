name: Go CI/CD Pipeline

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Go environment
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    # Step 3: Build the Go application
    - name: Build
      run: go build -v -o app .

    # Step 4: (Optional) Test the application
    - name: Test
      run: go test -v ./...
      continue-on-error: true # This allows the pipeline to continue even if tests fail

    # Step 5: Log in to Docker Hub
    - name: Log in to Docker Hub
      # Only run this step if the push is to the 'main' branch
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 6: Build and Push Docker Image
    - name: Build and push Docker image
      # Only run this step if the push is to the 'main' branch
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true # Pushes the image to the registry
        tags: ${{ secrets.DOCKER_USERNAME }}/student-ci-challenge:latest # Tag the image